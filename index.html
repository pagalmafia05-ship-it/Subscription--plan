<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Subscription Plans</title>
  <style>
    :root{
      --bg:#f6f9ff;
      --card:#ffffff;
      --accent:#3b82f6;
      --muted:#6b7280;
      --success:#10b981;
      --shadow: 0 8px 24px rgba(15,23,42,0.08);
      --glass: rgba(255,255,255,0.6);
    }
    *{box-sizing:border-box}
    body{
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      margin:0;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
      color:#0f172a;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:28px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:20px;
    }
    h1{margin:0;font-size:20px}
    p.lead{margin:0;color:var(--muted)}
    .layout{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:24px;
    }
    .cards{
      display:flex;
      flex-wrap:wrap;
      gap:18px;
    }
    .card{
      background:var(--card);
      border-radius:14px;
      padding:18px;
      width:100%;
      max-width:520px;
      box-shadow:var(--shadow);
      border:1px solid rgba(15,23,42,0.03);
    }
    .plan-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .plan-title{
      display:flex;
      flex-direction:column;
    }
    .plan-name{
      font-weight:700;
      font-size:20px;
      letter-spacing: -0.2px;
    }
    .plan-price{
      font-weight:800;
      font-size:28px;
      color:var(--accent);
    }
    .plan-features{margin-top:12px;color:var(--muted);line-height:1.6}
    .styled-text{
      background:linear-gradient(90deg,#000 0%, #222 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      font-weight:700;
    }
    .features-list{
      margin-top:12px;
      display:grid;
      gap:8px;
    }
    .feat{
      display:flex;
      gap:10px;
      align-items:center;
      color:#065f46;
      font-weight:600;
    }
    .buy{
      margin-top:14px;
      display:flex;
      gap:12px;
      align-items:center;
    }
    button.cta{
      background:var(--accent);
      color:white;
      border:0;
      padding:10px 16px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(59,130,246,0.18);
    }
    button.ghost{
      background:transparent;
      border:1px solid rgba(15,23,42,0.06);
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
    }
    .admin-box{
      background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0.8));
      border-radius:12px;
      padding:12px;
      box-shadow: var(--shadow);
    }
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input[type="text"], input[type="password"], input[type="number"], textarea{
      width:100%;
      padding:8px 10px;
      border-radius:8px;
      border:1px solid rgba(15,23,42,0.06);
      margin-bottom:10px;
    }
    .small{font-size:13px;color:var(--muted)}
    .upload-preview{width:100%;height:160px;border-radius:8px;object-fit:cover;border:1px dashed rgba(15,23,42,0.06);display:block}
    .admin-actions{display:flex;gap:10px;flex-wrap:wrap}
    .badge{display:inline-block;background:#eef2ff;color:var(--accent);padding:6px 8px;border-radius:8px;font-weight:700}
    footer{margin-top:24px;color:var(--muted);font-size:13px}
    .modal-backdrop{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      background:rgba(2,6,23,0.5);z-index:50;padding:18px;
    }
    .modal{
      width:100%;max-width:520px;background:var(--card);border-radius:12px;padding:16px;box-shadow:0 20px 40px rgba(2,6,23,0.4);
    }
    .modal img{width:100%;height:260px;object-fit:cover;border-radius:8px;border:1px solid rgba(15,23,42,0.04)}
    .modal .timer{font-weight:800;font-size:20px;margin-top:8px}
    .upi-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .upi-list button{flex:1 1 140px;padding:10px;border-radius:10px;border:1px solid rgba(15,23,42,0.06);background:transparent;cursor:pointer;font-weight:700}
    .hidden{display:none}
    @media (max-width:900px){
      .layout{grid-template-columns:1fr}
      .modal img{height:200px}
    }
  </style>
</head>

</html>
